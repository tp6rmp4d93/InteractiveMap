<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="現勘回傳 Pro - AI 反饋與地圖版">
    <meta name="theme-color" content="#1d9305">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">
    
    <title>現勘回傳 Pro - AI 反饋、地圖、方位角版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB_m91mDE1HSFIj-s-iiCsS9RvmVWgSl3E"></script>
</head>
<body class="bg-slate-100 min-h-screen p-2 md:p-4 flex flex-col items-center font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200 mt-1">
        
        <div class="bg-green-900 text-white py-2 px-4 text-center">
            <h1 class="text-base font-bold tracking-widest uppercase">現勘回傳系統 (Google AI 整合版)</h1>
            <p class="text-[9px] opacity-70 mt-0.5">TWD97轉換 | Google Geocoding | 日期浮水印 | AI 影像分析 | 即時地圖確認 | 方位角</p>
        </div>

        <div class="relative">
            <div id="map" class="w-full h-48 bg-slate-200 border-b border-slate-300"></div>
            <div class="absolute top-2 left-2 bg-white/90 px-2 py-1 rounded text-[10px] text-green-800 font-bold shadow-sm pointer-events-none">
                👆 點擊地圖可微調位置
            </div>
        </div>

        <form id="surveyForm" class="p-4 space-y-3">
            <div class="grid grid-cols-2 gap-2 items-center">
                <div id="deviceInfo" class="text-[9px] text-green-400 font-mono italic">Detecting...</div>
                <input type="password" id="authCode" value="SWC115" required class="w-full border border-slate-200 rounded-lg p-1.5 text-xs bg-slate-50 text-center focus:ring-1 focus:ring-green-500 outline-none text-slate-500">
            </div>
            
            <div class="flex gap-2">
                <div id="gpsBox" class="flex-grow bg-blue-50 text-blue-900 border border-blue-100 p-3 rounded-xl font-mono text-xs font-bold leading-relaxed shadow-sm">
                    <div id="gpsStatus" class="text-green-600 mb-1">📍 初始化定位中...</div>
                    <div id="coordDisplay" class="text-[11px] text-slate-700">等待載入坐標資訊...</div>
                    <input type="hidden" id="lat"><input type="hidden" id="lon">
                    <input type="hidden" id="twd97x"><input type="hidden" id="twd97y">
                    <input type="hidden" id="azimuthValue">
                </div>
                <button type="button" id="refreshBtn" class="bg-green-600 text-white px-3 rounded-xl text-xs font-bold shadow hover:bg-green-700 transition-all flex-shrink-0 flex items-center justify-center active:scale-95">
                    重新<br>定位
                </button>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">道路路名/地址 (自動解析或微調)</label>
                <input type="text" id="roadName" placeholder="等待定位..." class="w-full border border-slate-300 rounded-xl p-2.5 text-sm text-green-900 font-semibold bg-green-50 outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">現勘照片 (讀取時間與拍攝方位角)</label>
                <input type="file" id="photoInput" accept="image/*" required 
                       class="block w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:bg-green-600 file:text-white file:font-bold hover:file:bg-green-700 cursor-pointer">
            </div>

            <div class="relative">
                <label class="block text-xs font-bold text-slate-700 mb-1.5">災情摘要說明</label>
                <textarea id="note" rows="3" class="w-full border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-green-500 outline-none transition-all shadow-sm" placeholder="請上傳照片，AI 將自動生成描述..."></textarea>
                <div id="aiLoader" class="hidden absolute right-3 bottom-3 flex items-center space-x-1 text-green-600 text-[10px] bg-white/90 px-2 py-1 rounded-md shadow-sm border border-green-100">
                    <span class="animate-bounce">🤖</span>
                    <span class="font-bold">AI 分析中...</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" disabled class="w-full bg-slate-400 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-95 text-base mt-2">
                讀取定位中...
            </button>
        </form>
    </div>

    <div id="uploadLoader" class="hidden fixed inset-0 bg-slate-900/80 items-center justify-center text-white flex-col space-y-4 z-50 backdrop-blur-md">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-green-500 border-t-transparent"></div>
        <p class="font-bold tracking-widest text-lg font-bold">正在將資料存入雲端...</p>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        // GAS 部署網址 (記得發布新版本)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycY4N4LQ-W56a_w-kzxEKHvkDQwtKJ_ETOMxOOpFhqI_TQ4-zzwqvRA1NYReqSzfUo/exec"; 

        const gpsStatus = document.getElementById('gpsStatus');
        const coordDisplay = document.getElementById('coordDisplay');
        const roadNameInput = document.getElementById('roadName');
        const noteArea = document.getElementById('note');
        const submitBtn = document.getElementById('submitBtn');
        const aiLoader = document.getElementById('aiLoader');
        const uploadLoader = document.getElementById('uploadLoader');
        const refreshBtn = document.getElementById('refreshBtn');
        
        let map, marker;
        let globalExifDate = null; 
        let globalAzimuth = "無資訊"; // ✨ 全域方位角

        function initMap(lat, lon) {
            const pos = { lat: parseFloat(lat), lng: parseFloat(lon) };
            if (!map) {
                map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 17, center: pos, disableDefaultUI: true, mapTypeId: 'roadmap', clickableIcons: false
                });
                marker = new google.maps.Marker({ 
                    position: pos, map: map, animation: google.maps.Animation.DROP, draggable: true 
                });

                map.addListener("click", (e) => updateLocation(e.latLng.lat(), e.latLng.lng(), "📍 地圖手動點選定位"));
                marker.addListener("dragend", () => updateLocation(marker.getPosition().lat(), marker.getPosition().lng(), "📍 圖釘手動拖曳定位"));
            } else {
                map.setCenter(pos);
                marker.setPosition(pos);
            }
        }

        function convertWGS84toTWD97(lon, lat) {
            const a = 6378137.0, b = 6356752.314245, lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
            const e = Math.sqrt(1 - Math.pow(b, 2) / Math.pow(a, 2)), e2 = Math.pow(e, 2) / (1 - Math.pow(e, 2));
            const lonRad = lon * Math.PI / 180, latRad = lat * Math.PI / 180;
            const A = (lonRad - lon0) * Math.cos(latRad), T = Math.pow(Math.tan(latRad), 2), C = e2 * Math.pow(Math.cos(latRad), 2);
            const M = a * ((1 - Math.pow(e, 2) / 4 - 3 * Math.pow(e, 4) / 64) * latRad - (3 * Math.pow(e, 2) / 8 + 3 * Math.pow(e, 4) / 32) * Math.sin(2 * latRad) + (15 * Math.pow(e, 4) / 256) * Math.sin(4 * latRad));
            const x = k0 * a * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + Math.pow(T, 2) + 72 * C - 58 * e2) * Math.pow(A, 5) / 120) + dx;
            const y = k0 * (M + a * Math.tan(latRad) * (Math.pow(A, 2) / 2 + (5 - T + 9 * C + 4 * Math.pow(C, 2)) * Math.pow(A, 4) / 24 + (61 - 58 * T + Math.pow(T, 2) + 600 * C - 330 * e2) * Math.pow(A, 6) / 720));
            return { x: x.toFixed(3), y: y.toFixed(3) };
        }

        // ✨ 將度數轉換為方位中文
        function getDirectionName(degree) {
            if (degree === "無資訊") return "";
            const val = parseFloat(degree);
            if (val >= 337.5 || val < 22.5) return "北";
            if (val >= 22.5 && val < 67.5) return "東北";
            if (val >= 67.5 && val < 112.5) return "東";
            if (val >= 112.5 && val < 157.5) return "東南";
            if (val >= 157.5 && val < 202.5) return "南";
            if (val >= 202.5 && val < 247.5) return "西南";
            if (val >= 247.5 && val < 292.5) return "西";
            if (val >= 292.5 && val < 337.5) return "西北";
            return "";
        }

        async function updateLocation(lat, lon, sourceMsg) {
            document.getElementById('lat').value = lat;
            document.getElementById('lon').value = lon;
            initMap(lat, lon);
            
            const twd97 = convertWGS84toTWD97(lon, lat);
            document.getElementById('twd97x').value = twd97.x;
            document.getElementById('twd97y').value = twd97.y;
            
            gpsStatus.innerHTML = sourceMsg;
            
            // ✨ 顯示坐標與方位角
            let dirText = globalAzimuth !== "無資訊" ? ` | 方位: ${globalAzimuth}° (${getDirectionName(globalAzimuth)})` : "";
            coordDisplay.innerHTML = `WGS: ${lat.toFixed(6)}, ${lon.toFixed(6)}${dirText}<br>TWD: ${twd97.x}, ${twd97.y}`;
            
            roadNameInput.value = ""; roadNameInput.placeholder = "🔍 解析地址中...";
            try {
                const res = await fetch(`${GAS_URL}?lat=${lat}&lon=${lon}`);
                const data = await res.json();
                roadNameInput.value = (data.address === "無法解析地址" || data.address.includes("錯誤")) ? "" : data.address;
                if (!roadNameInput.value) roadNameInput.placeholder = "無法解析，請手動輸入";
            } catch (e) { roadNameInput.placeholder = "解析逾時，請手動輸入"; }
            
            submitBtn.disabled = false;
            submitBtn.innerText = "確認並傳送數據";
            submitBtn.className = "w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-base mt-2";
        }

        function getRealtimeLocation() {
            gpsStatus.innerHTML = "📍 獲取設備定位中...";
            globalAzimuth = "無資訊"; // 即時定位不抓羅盤，保留為無資訊
            navigator.geolocation.getCurrentPosition(
                (p) => updateLocation(p.coords.latitude, p.coords.longitude, "📍 即時設備定位"),
                (e) => { gpsStatus.innerHTML = "❌ 定位失敗，請點擊地圖。"; submitBtn.disabled = false; submitBtn.innerText = "請先確認定位"; },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }
        window.onload = getRealtimeLocation; refreshBtn.onclick = getRealtimeLocation;

        function extractExifData(file) {
            return new Promise(resolve => {
                EXIF.getData(file, function() {
                    let lat = EXIF.getTag(this, "GPSLatitude");
                    let lon = EXIF.getTag(this, "GPSLongitude");
                    let latRef = EXIF.getTag(this, "GPSLatitudeRef");
                    let lonRef = EXIF.getTag(this, "GPSLongitudeRef");
                    let dateObj = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                    let dir = EXIF.getTag(this, "GPSImgDirection"); // ✨ 抓取拍攝方位角
                    resolve({ lat, lon, latRef, lonRef, dateObj, dir });
                });
            });
        }

        document.getElementById('photoInput').onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            submitBtn.disabled = true;
            globalExifDate = null; 
            globalAzimuth = "無資訊";

            const exif = await extractExifData(file);
            
            // ✨ 處理方位角 (四捨五入到整數)
            if (exif.dir !== undefined && !isNaN(exif.dir)) {
                globalAzimuth = Math.round(Number(exif.dir));
            }

            if (exif.lat && exif.lon) {
                const fmt = (c, r) => (c[0] + c[1]/60 + c[2]/3600) * (r === "S" || r === "W" ? -1 : 1);
                updateLocation(fmt(exif.lat, exif.latRef), fmt(exif.lon, exif.lonRef), "📸 使用相片原始坐標");
            }

            if (exif.dateObj) {
                let datePart = exif.dateObj.split(" ")[0]; 
                globalExifDate = datePart.replace(/:/g, "/"); 
            }

            noteArea.value = ""; noteArea.placeholder = "🤖 AI 正在分析影像內容，請稍候...";
            aiLoader.classList.remove('hidden');
            
            try {
                const b64 = await processImage(file);
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "analyze_only", photo_base64: b64 }) });
                const result = await res.json();
                if (result.status === "success" && result.message) {
                    noteArea.value = result.message;
                } else {
                    noteArea.placeholder = "AI 分析完成但無內容，請手動輸入。";
                }
            } catch (err) {
                noteArea.placeholder = "AI 服務異常，請手動描述。";
            } finally {
                aiLoader.classList.add('hidden');
                submitBtn.disabled = false;
            }
        };

        async function processImage(file) {
            return new Promise(r => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('processCanvas'); const ctx = cvs.getContext('2d');
                    cvs.width = 3000; cvs.height = 2000;
                    const rat = 1.5; let w = img.width, h = img.height, sx = 0, sy = 0;
                    if (w/h > rat) { w = h * rat; sx = (img.width - w)/2; } else { h = w / rat; sy = (img.height - h)/2; }
                    ctx.drawImage(img, sx, sy, w, h, 0, 0, 3000, 2000);
                    
                    let watermarkDate = globalExifDate;
                    if (!watermarkDate) {
                        const d = new Date();
                        watermarkDate = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
                    }

                    ctx.font = "bold 48px Arial"; ctx.fillStyle = "red"; ctx.textAlign = "right";
                    ctx.fillText(watermarkDate, 2950, 1950);
                    r(cvs.toDataURL('image/jpeg', 0.85).split(',')[1]);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        document.getElementById('surveyForm').onsubmit = async (e) => {
            e.preventDefault();
            uploadLoader.classList.replace('hidden', 'flex');
            submitBtn.disabled = true;

            const b64 = await processImage(document.getElementById('photoInput').files[0]);
            const payload = {
                auth_code: document.getElementById('authCode').value,
                device: deviceName,
                latitude: document.getElementById('lat').value,
                longitude: document.getElementById('lon').value,
                twd97_x: document.getElementById('twd97x').value,
                twd97_y: document.getElementById('twd97y').value,
                azimuth: globalAzimuth !== "無資訊" ? `${globalAzimuth}° (${getDirectionName(globalAzimuth)})` : "無資訊", // ✨ 送出方位角與中文名稱
                road_name: roadNameInput.value,
                note: noteArea.value,
                exif_date: globalExifDate || "無紀錄",
                photo_base64: b64
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("✅ 成功！資料與照片已寫入雲端。");
                    window.location.reload();
                } else {
                    alert("❌ 錯誤: " + result.message);
                }
            } catch (err) {
                alert("❌ 連線失敗，請檢查網路狀態。");
            } finally {
                uploadLoader.classList.replace('flex', 'hidden');
                submitBtn.disabled = false;
            }
        };

        const deviceName = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? (navigator.userAgent.match(/iPhone|iPad|Android/i)[0]) : "PC";
        document.getElementById('deviceInfo').innerText = "Device: " + deviceName;
    </script>
</body>
</html>
