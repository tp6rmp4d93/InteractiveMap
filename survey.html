<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現勘記錄系統!Kevin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-red-700 text-white p-5">
            <h1 class="text-lg font-bold">🛠️ 現勘回傳</h1>
            <p class="text-xs opacity-80">自動裁切 3:2 | 紅色日期浮水印 | TWD97 轉換</p>
        </div>

        <form id="surveyForm" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">現勘授權碼</label>
                <input type="password" id="authCode" placeholder="請輸入授權碼" required class="w-full border rounded-lg p-2 text-sm">
            </div>

            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                <div id="gpsStatus" class="text-xs font-mono text-blue-700 leading-tight">定位獲取中...</div>
                <input type="hidden" id="lat"><input type="hidden" id="lon">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">道路路名</label>
                <input type="text" id="roadName" placeholder="例如：台 7 線 32K" required class="w-full border rounded-lg p-2 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">現場照片 (自動裁切 3:2 + 浮水印)</label>
                <input type="file" id="photoInput" accept="image/*" capture="camera" required class="w-full text-xs">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">災情摘要</label>
                <textarea id="note" rows="3" placeholder="請簡述災情..." required class="w-full border rounded-lg p-2 text-sm"></textarea>
            </div>

            <button type="submit" id="submitBtn" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl shadow-lg">等待定位...</button>
        </form>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycY4N4LQ-W56a_w-kzxEKHvkDQwtKJ_ETOMxOOpFhqI_TQ4-zzwqvRA1NYReqSzfUo/exec";
        const gpsStatus = document.getElementById('gpsStatus');
        const submitBtn = document.getElementById('submitBtn');

        // 1. GPS 定位
        navigator.geolocation.getCurrentPosition((p) => {
            document.getElementById('lat').value = p.coords.latitude;
            document.getElementById('lon').value = p.coords.longitude;
            gpsStatus.innerHTML = `📍 WGS84: ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}<br>精度: ±${p.coords.accuracy.toFixed(1)}m`;
            submitBtn.disabled = false;
            submitBtn.innerText = "確認並傳送";
            submitBtn.className = "w-full bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg";
        }, (e) => { gpsStatus.innerText = "❌ 定位失敗，請檢查權限"; }, { enableHighAccuracy: true });

        // 2. 影像處理邏輯
        async function processImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('processCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 設定 3:2 裁切尺寸
                    let targetW, targetH;
                    if (img.width / img.height > 1.5) {
                        targetH = img.height;
                        targetW = img.height * 1.5;
                    } else {
                        targetW = img.width;
                        targetH = img.width / 1.5;
                    }

                    canvas.width = 1200; // 統一輸出寬度
                    canvas.height = 800; // 1200 / 1.5

                    // 繪製裁切後的圖像 (等比例)
                    ctx.drawImage(img, (img.width - targetW) / 2, (img.height - targetH) / 2, targetW, targetH, 0, 0, 1200, 800);

                    // 加入紅色日期戳記
                    const now = new Date();
                    const dateStr = now.getFullYear() + (now.getMonth() + 1).toString().padStart(2, '0') + "-" + now.getDate().toString().padStart(2, '0');
                    ctx.font = "bold 14px Arial";
                    ctx.fillStyle = "red";
                    ctx.textAlign = "right";
                    ctx.fillText(dateStr, canvas.width - 20, canvas.height - 20);

                    resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // 3. 表單送出
        document.getElementById('surveyForm').onsubmit = async (e) => {
            e.preventDefault();
            submitBtn.innerText = "處理中...";
            submitBtn.disabled = true;

            const photoFile = document.getElementById('photoInput').files[0];
            
            // 提取 EXIF 時間
            EXIF.getData(photoFile, async function() {
                const exifTime = EXIF.getTag(this, "DateTimeOriginal") || new Date().toLocaleString();
                const processedBase64 = await processImage(photoFile);

                const payload = {
                    auth_code: document.getElementById('authCode').value,
                    latitude: document.getElementById('lat').value,
                    longitude: document.getElementById('lon').value,
                    road_name: document.getElementById('roadName').value,
                    note: document.getElementById('note').value,
                    exif_time: exifTime,
                    photo_base64: processedBase64
                };

                try {
                    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await res.json();
                    if (result.status === "success") {
                        alert("✅ 上傳成功！");
                        window.location.reload();
                    } else { alert("❌ 錯誤: " + result.message); }
                } catch (err) { alert("❌ 連線失敗"); }
                submitBtn.disabled = false;
            });
        };
    </script>
</body>
</html>
