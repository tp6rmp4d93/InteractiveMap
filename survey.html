<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現勘回傳系統 (Google 地圖版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-green-900 text-white p-6">
            <h1 class="text-xl font-bold flex items-center gap-2">🌍 現勘回傳系統 (Google 版)</h1>
            <p class="text-[10px] opacity-70 mt-1">TWD97 轉換 | Google Geocoding | 3:2+浮水印</p>
        </div>

        <form id="surveyForm" class="p-6 space-y-4">
            <div id="deviceInfo" class="text-[10px] text-blue-500 font-mono italic">Device info loading...</div>
            
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">現勘授權碼</label>
                <input type="password" id="authCode" value="SWC115" required class="w-full border rounded-xl p-3 text-sm border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div id="gpsBox" class="bg-slate-800 text-green-400 p-4 rounded-xl font-mono text-[11px] leading-relaxed transition-all">
                <div id="gpsStatus">📍 正在獲取設備目前定位...</div>
                <input type="hidden" id="lat"><input type="hidden" id="lon">
                <input type="hidden" id="twd97x"><input type="hidden" id="twd97y">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">道路路名/地址 (Google Maps 解析)</label>
                <div class="flex gap-2">
                    <input type="text" id="roadName" placeholder="等待定位與解析..." class="w-full border rounded-xl p-3 text-sm border-slate-300 text-blue-800 font-semibold bg-green-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" id="refreshLocationBtn" class="bg-green-600 text-white px-4 rounded-xl text-sm font-bold shadow hover:bg-green-700 active:scale-95 transition-all flex-shrink-0 flex items-center justify-center">
                        更新定位
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 mt-4">上傳現勘照片 (若含 EXIF 將覆蓋上述位置)</label>
                <input type="file" id="photoInput" accept="image/*" required class="block w-full text-xs text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-full file:border-0 file:bg-green-600 file:text-white file:font-bold hover:file:bg-green-700 cursor-pointer">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">災情摘要</label>
                <textarea id="note" rows="2" class="w-full border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="若無請留空，系統將自動填寫 Null"></textarea>
            </div>

            <button type="submit" id="submitBtn" disabled class="w-full bg-slate-400 text-white font-bold py-4 rounded-xl">等待定位中...</button>
        </form>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/80 items-center justify-center text-white flex-col z-50">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
        <p class="mt-4 font-bold">高解析影像處理與上傳中...</p>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        // ⚠️ GAS 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycY4N4LQ-W56a_w-kzxEKHvkDQwtKJ_ETOMxOOpFhqI_TQ4-zzwqvRA1NYReqSzfUo/exec"; 
        
        const gpsStatus = document.getElementById('gpsStatus');
        const roadNameInput = document.getElementById('roadName');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const refreshBtn = document.getElementById('refreshLocationBtn');

        const deviceName = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? (navigator.userAgent.match(/iPhone|iPad|Android/i)[0]) : "PC/Browser";
        document.getElementById('deviceInfo').innerText = "上傳裝置: " + deviceName;

        // 🟢 大地工程級 TWD97 轉換公式 (前端直接算，零延遲)
        function convertWGS84toTWD97(lon, lat) {
            const a = 6378137.0, b = 6356752.314245, lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
            const e = Math.sqrt(1 - Math.pow(b, 2) / Math.pow(a, 2)), e2 = Math.pow(e, 2) / (1 - Math.pow(e, 2));
            const lonRad = lon * Math.PI / 180, latRad = lat * Math.PI / 180;
            const A = (lonRad - lon0) * Math.cos(latRad), T = Math.pow(Math.tan(latRad), 2), C = e2 * Math.pow(Math.cos(latRad), 2);
            const M = a * ((1 - Math.pow(e, 2) / 4 - 3 * Math.pow(e, 4) / 64) * latRad - (3 * Math.pow(e, 2) / 8 + 3 * Math.pow(e, 4) / 32) * Math.sin(2 * latRad) + (15 * Math.pow(e, 4) / 256) * Math.sin(4 * latRad));
            const x = k0 * a * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + Math.pow(T, 2) + 72 * C - 58 * e2) * Math.pow(A, 5) / 120) + dx;
            const y = k0 * (M + a * Math.tan(latRad) * (Math.pow(A, 2) / 2 + (5 - T + 9 * C + 4 * Math.pow(C, 2)) * Math.pow(A, 4) / 24 + (61 - 58 * T + Math.pow(T, 2) + 600 * C - 330 * e2) * Math.pow(A, 6) / 720));
            return { x: x.toFixed(3), y: y.toFixed(3) };
        }

        // 🟢 更新座標與呼叫 GAS 取得 Google 地址
        async function updateCoordsAndAddress(lat, lon, sourceMsg, isSuccess = true) {
            document.getElementById('lat').value = lat; 
            document.getElementById('lon').value = lon;
            
            if (isSuccess) {
                // 1. 前端瞬間算出 TWD97
                const twd97 = convertWGS84toTWD97(lon, lat);
                document.getElementById('twd97x').value = twd97.x;
                document.getElementById('twd97y').value = twd97.y;

                gpsStatus.innerHTML = `${sourceMsg}<br>WGS84: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>TWD97: <span class="text-blue-300">${twd97.x}, ${twd97.y}</span>`;
                gpsStatus.className = "bg-slate-800 text-green-400 p-4 rounded-xl font-mono text-[11px] leading-relaxed";
                
                // 2. 呼叫 GAS 取得 Google 解析地址 (加入 5 秒超時控制)
                roadNameInput.value = "";
                roadNameInput.placeholder = "🔍 呼叫 Google 地圖解析中...";
                
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(`${GAS_URL}?lat=${lat}&lon=${lon}`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    const d = await res.json();
                    if (d.address && d.address !== "無法解析地址") {
                        roadNameInput.value = d.address;
                    } else {
                        roadNameInput.placeholder = "Google 無法精確定位此處，請手動輸入";
                    }
                } catch(e) { 
                    roadNameInput.placeholder = e.name === 'AbortError' ? "⚠️ 解析超時，請手動輸入" : "⚠️ 連線被拒，請檢查 GAS 網址";
                }
                
                submitBtn.disabled = false; 
                submitBtn.innerText = "確認並傳送紀錄";
                submitBtn.className = "w-full bg-green-700 hover:bg-green-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all";
            } else {
                gpsStatus.innerHTML = sourceMsg;
                gpsStatus.className = "bg-slate-800 text-red-400 p-4 rounded-xl font-mono text-[11px] leading-relaxed";
                roadNameInput.placeholder = "無座標，請手動輸入地址";
            }
        }

        // 手動更新定位按鈕
        refreshBtn.addEventListener('click', () => {
            refreshBtn.innerText = "定位中..."; refreshBtn.disabled = true; refreshBtn.classList.replace('bg-green-600', 'bg-slate-400');
            navigator.geolocation.getCurrentPosition(
                (p) => { updateCoordsAndAddress(p.coords.latitude, p.coords.longitude, "📍 [手動刷新] 設備最新定位"); resetRefreshBtn(); }, 
                () => { alert("❌ 無法獲取設備定位。"); resetRefreshBtn(); }, 
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        });
        function resetRefreshBtn() { refreshBtn.innerText = "更新定位"; refreshBtn.disabled = false; refreshBtn.classList.replace('bg-slate-400', 'bg-green-600'); }

        // 載入時定位
        window.onload = () => {
            navigator.geolocation.getCurrentPosition(
                (p) => updateCoordsAndAddress(p.coords.latitude, p.coords.longitude, "📍 [目前位置] 設備即時定位"), 
                () => updateCoordsAndAddress(0, 0, "❌ 無法獲取設備定位，請稍後更新定位或使用照片座標", false), 
                { enableHighAccuracy: true }
            );
        };

        // 讀取 EXIF
        document.getElementById('photoInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const oldText = gpsStatus.innerHTML;
            gpsStatus.innerHTML = "⏳ 正在掃描相片 EXIF 數據...";
            submitBtn.disabled = true;

            EXIF.getData(file, function() {
                let lat = EXIF.getTag(this, "GPSLatitude"), lon = EXIF.getTag(this, "GPSLongitude");
                if (lat && lon) {
                    const fmt = (c, r) => (c[0] + c[1]/60 + c[2]/3600) * (r === "S" || r === "W" ? -1 : 1);
                    updateCoordsAndAddress(fmt(lat, EXIF.getTag(this, "GPSLatitudeRef")), fmt(lon, EXIF.getTag(this, "GPSLongitudeRef")), "📸 [照片位置] 已更新為相片拍攝座標");
                } else {
                    gpsStatus.innerHTML = "⚠️ 相片無座標，維持使用上述設備定位。<br>" + oldText;
                    submitBtn.disabled = false;
                }
            });
        };

        // 影像處理
        async function processImage(file) {
            return new Promise(r => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('processCanvas'); const ctx = cvs.getContext('2d');
                    cvs.width = 3000; cvs.height = 2000; const rat = 1.5; let w = img.width, h = img.height, sx = 0, sy = 0;
                    if (w/h > rat) { w = h * rat; sx = (img.width - w)/2; } else { h = w / rat; sy = (img.height - h)/2; }
                    ctx.drawImage(img, sx, sy, w, h, 0, 0, 3000, 2000);
                    const d = new Date(); const ds = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
                    ctx.font = "bold 120px Arial"; ctx.fillStyle = "red"; ctx.textAlign = "right"; ctx.fillText(ds, 2960, 1960);
                    r(cvs.toDataURL('image/jpeg', 0.8).split(',')[1]);
                }; img.src = URL.createObjectURL(file);
            });
        }

        // 送出資料
        document.getElementById('surveyForm').onsubmit = async (e) => {
            e.preventDefault();
            loader.classList.replace('hidden', 'flex'); submitBtn.disabled = true;
            
            const b64 = await processImage(document.getElementById('photoInput').files[0]);
            
            const payload = {
                auth_code: document.getElementById('authCode').value,
                device: deviceName,
                twd97_x: document.getElementById('twd97x').value,
                twd97_y: document.getElementById('twd97y').value,
                latitude: document.getElementById('lat').value,   // 新增：WGS84 緯度
                longitude: document.getElementById('lon').value,  // 新增：WGS84 經度
                road_name: document.getElementById('roadName').value,
                note: document.getElementById('note').value,
                photo_base64: b64
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") { alert("✅ 紀錄成功寫入試算表！"); window.location.reload(); }
                else { alert("❌ 儲存失敗: " + result.message); loader.classList.replace('flex', 'hidden'); submitBtn.disabled = false; }
            } catch (err) { alert("❌ 網路連線錯誤，請重試。"); loader.classList.replace('flex', 'hidden'); submitBtn.disabled = false; }
        };
    </script>
</body>
</html>
