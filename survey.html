<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現勘系統 Pro (修正版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="bg-green-900 text-white p-6">
            <h1 class="text-xl font-bold flex items-center gap-2">📐 現勘回傳系統</h1>
            <p class="text-[10px] opacity-70 mt-1">欄位修正版 | 3000x2000 | 裝置偵測</p>
        </div>

        <form id="surveyForm" class="p-6 space-y-4">
            <div id="deviceInfo" class="text-[10px] text-blue-500 font-mono italic">Device info loading...</div>
            
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">現勘授權碼</label>
                <input type="password" id="authCode" value="SWC115" required class="w-full border rounded-xl p-3 text-sm border-slate-300">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">上傳現勘照片</label>
                <input type="file" id="photoInput" accept="image/*" required class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-green-600 file:text-white">
            </div>

            <div id="gpsBox" class="bg-slate-800 text-green-400 p-4 rounded-xl font-mono text-[11px] leading-relaxed">
                <div id="gpsStatus">請先選取照片...</div>
                <input type="hidden" id="lat"><input type="hidden" id="lon">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">道路路名 (自動解析後可微調)</label>
                <input type="text" id="roadName" placeholder="待解析地址..." class="w-full border rounded-xl p-3 text-sm border-slate-300">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">災情摘要</label>
                <textarea id="note" rows="2" class="w-full border-slate-300 rounded-xl p-3 text-sm" placeholder="若無請留空"></textarea>
            </div>

            <button type="submit" id="submitBtn" disabled class="w-full bg-slate-400 text-white font-bold py-4 rounded-xl">讀取資料中...</button>
        </form>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/80 items-center justify-center text-white flex-col z-50">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
        <p class="mt-4 font-bold">高解析影像處理中...</p>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycY4N4LQ-W56a_w-kzxEKHvkDQwtKJ_ETOMxOOpFhqI_TQ4-zzwqvRA1NYReqSzfUo/exec"; 
        const gpsStatus = document.getElementById('gpsStatus');
        const roadNameInput = document.getElementById('roadName');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');

        // 裝置偵測
        const device = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? (navigator.userAgent.match(/iPhone|iPad|Android/i)[0]) : "PC/Browser";
        document.getElementById('deviceInfo').innerText = "上傳裝置: " + device;

        document.getElementById('photoInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            gpsStatus.innerText = "> 讀取 EXIF...";
            EXIF.getData(file, function() {
                let lat = EXIF.getTag(this, "GPSLatitude"), lon = EXIF.getTag(this, "GPSLongitude");
                if (lat && lon) {
                    const fmt = (c, r) => (c[0] + c[1]/60 + c[2]/3600) * (r === "S" || r === "W" ? -1 : 1);
                    updateCoords(fmt(lat, EXIF.getTag(this, "GPSLatitudeRef")), fmt(lon, EXIF.getTag(this, "GPSLongitudeRef")), "📸 使用照片拍攝坐標");
                } else {
                    navigator.geolocation.getCurrentPosition((p) => updateCoords(p.coords.latitude, p.coords.longitude, "📍 使用設備即時定位"), 
                    () => { gpsStatus.innerText = "❌ 無法定位"; submitBtn.disabled=false; }, {enableHighAccuracy:true});
                }
            });
        };

        async function updateCoords(lat, lon, src) {
            document.getElementById('lat').value = lat; document.getElementById('lon').value = lon;
            gpsStatus.innerHTML = `${src}<br>WGS84: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            roadNameInput.value = "地址解析中...";
            try {
                const res = await fetch(`${GAS_URL}?lat=${lat}&lon=${lon}`);
                const d = await res.json();
                roadNameInput.value = (d.address === "無法解析地址") ? "" : d.address;
            } catch(e) { roadNameInput.value = ""; }
            submitBtn.disabled = false; submitBtn.innerText = "確認並傳送";
            submitBtn.className = "w-full bg-green-700 text-white font-bold py-4 rounded-xl";
        }

        async function processImage(file) {
            return new Promise(r => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('processCanvas');
                    const ctx = cvs.getContext('2d');
                    cvs.width = 3000; cvs.height = 2000;
                    const rat = 1.5; let w = img.width, h = img.height, sx = 0, sy = 0;
                    if (w/h > rat) { w = h * rat; sx = (img.width - w)/2; } else { h = w / rat; sy = (img.height - h)/2; }
                    ctx.drawImage(img, sx, sy, w, h, 0, 0, 3000, 2000);
                    const d = new Date();
                    const ds = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
                    ctx.font = "bold 160px Arial"; ctx.fillStyle = "red"; ctx.textAlign = "right";
                    ctx.fillText(ds, 2960, 1960);
                    r(cvs.toDataURL('image/jpeg', 0.8).split(',')[1]);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        document.getElementById('surveyForm').onsubmit = async (e) => {
            e.preventDefault();
            loader.classList.replace('hidden', 'flex');
            const b64 = await processImage(document.getElementById('photoInput').files[0]);
            
            // ✨ 這裡確保傳送的 Key 與 GAS 對應
            const payload = {
                auth_code: document.getElementById('authCode').value,
                device: device,
                latitude: document.getElementById('lat').value,
                longitude: document.getElementById('lon').value,
                road_name: roadNameInput.value,
                note: document.getElementById('note').value,
                photo_base64: b64
            };

            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            if (result.status === "success") { alert("✅ 上傳成功"); window.location.reload(); }
            else { alert("❌ " + result.message); loader.classList.replace('flex', 'hidden'); }
        };
    </script>
</body>
</html>
