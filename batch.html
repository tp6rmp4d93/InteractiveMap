<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現勘系統 Pro - 批次上傳中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB_m91mDE1HSFIj-s-iiCsS9RvmVWgSl3E"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-green-900 text-white p-5 text-center">
            <h1 class="text-xl font-bold tracking-widest uppercase">Batch Upload Center</h1>
            <p class="text-[10px] opacity-80 mt-1">缺漏坐標可點擊手動補齊 | AI 批次辨識 | 背景上傳</p>
        </div>

        <div class="p-5 space-y-5">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="w-full md:w-1/4">
                    <label class="block text-xs font-bold text-slate-500 mb-1">現勘授權碼</label>
                    <input type="password" id="authCode" value="SWC115" class="w-full border border-slate-300 rounded-lg p-2 text-sm text-center focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div class="w-full md:w-2/4">
                    <label class="block text-xs font-bold text-slate-500 mb-1">選擇多張照片 (支援無坐標照片)</label>
                    <input type="file" id="batchPhotoInput" accept="image/*" multiple class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-green-100 file:text-green-700 hover:file:bg-green-200 cursor-pointer">
                </div>
                <div class="w-full md:w-1/4 flex items-end h-full">
                    <button id="startBatchBtn" disabled class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-green-700 disabled:bg-slate-300 transition-all text-sm active:scale-95">
                        開始批次處理 (0)
                    </button>
                </div>
            </div>

            <div id="overallProgress" class="hidden">
                <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
                    <span>總進度</span>
                    <span id="progressText">0 / 0</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-green-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-xs text-slate-500 uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3 w-16">預覽</th>
                            <th class="p-3 w-28 text-center">拍攝時間</th>
                            <th class="p-3 w-32 text-center">TWD97 坐標 (可點選)</th>
                            <th class="p-3">AI 摘要與狀態</th>
                            <th class="p-3 w-20 text-center">上傳狀態</th>
                        </tr>
                    </thead>
                    <tbody id="queueList" class="text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400 italic font-bold">請先點擊上方選擇照片</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="mapModal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col transform transition-all">
            <div class="bg-green-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-sm tracking-widest">📍 手動標註拍攝位置</h3>
                <button onclick="closeMapModal()" class="text-white hover:text-red-400 font-bold text-xl leading-none">&times;</button>
            </div>
            <div id="modalMap" class="w-full h-72 bg-slate-200 relative">
                <div class="absolute bottom-2 left-2 bg-white/90 px-2 py-1 rounded text-[10px] text-green-800 font-bold shadow pointer-events-none z-10">
                    👆 點擊地圖或拖曳圖釘來設定位置
                </div>
            </div>
            <div class="p-4 flex justify-end gap-3 bg-slate-50 border-t border-slate-200">
                <button onclick="closeMapModal()" class="px-4 py-2 bg-slate-300 text-slate-700 font-bold text-xs rounded-lg hover:bg-slate-400 transition-all">取消</button>
                <button onclick="saveManualLocation()" class="px-4 py-2 bg-green-600 text-white font-bold text-xs rounded-lg hover:bg-green-700 transition-all shadow-md active:scale-95">確認坐標並儲存</button>
            </div>
        </div>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>

    <script>
        // ⚠️  GAS 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycY4N4LQ-W56a_w-kzxEKHvkDQwtKJ_ETOMxOOpFhqI_TQ4-zzwqvRA1NYReqSzfUo/exec"; 
        
        const fileInput = document.getElementById('batchPhotoInput');
        const startBtn = document.getElementById('startBatchBtn');
        const queueList = document.getElementById('queueList');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const overallProgress = document.getElementById('overallProgress');

        let uploadQueue = [];
        let isProcessing = false;
        
        // Modal 地圖相關變數
        let modalMap, modalMarker;
        let currentEditId = null;

        // 🟢 TWD97 轉換公式
        function convertWGS84toTWD97(lon, lat) {
            const a = 6378137.0, b = 6356752.314245, lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
            const e = Math.sqrt(1 - Math.pow(b, 2) / Math.pow(a, 2)), e2 = Math.pow(e, 2) / (1 - Math.pow(e, 2));
            const lonRad = lon * Math.PI / 180, latRad = lat * Math.PI / 180;
            const A = (lonRad - lon0) * Math.cos(latRad), T = Math.pow(Math.tan(latRad), 2), C = e2 * Math.pow(Math.cos(latRad), 2);
            const M = a * ((1 - Math.pow(e, 2) / 4 - 3 * Math.pow(e, 4) / 64) * latRad - (3 * Math.pow(e, 2) / 8 + 3 * Math.pow(e, 4) / 32) * Math.sin(2 * latRad) + (15 * Math.pow(e, 4) / 256) * Math.sin(4 * latRad));
            const x = k0 * a * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + Math.pow(T, 2) + 72 * C - 58 * e2) * Math.pow(A, 5) / 120) + dx;
            const y = k0 * (M + a * Math.tan(latRad) * (Math.pow(A, 2) / 2 + (5 - T + 9 * C + 4 * Math.pow(C, 2)) * Math.pow(A, 4) / 24 + (61 - 58 * T + Math.pow(T, 2) + 600 * C - 330 * e2) * Math.pow(A, 6) / 720));
            return { x: x.toFixed(3), y: y.toFixed(3) };
        }

        // 🟢 讀取 EXIF
        function extractExifData(file) {
            return new Promise(resolve => {
                EXIF.getData(file, function() {
                    let lat = EXIF.getTag(this, "GPSLatitude");
                    let lon = EXIF.getTag(this, "GPSLongitude");
                    let latRef = EXIF.getTag(this, "GPSLatitudeRef");
                    let lonRef = EXIF.getTag(this, "GPSLongitudeRef");
                    let dateObj = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                    resolve({ lat, lon, latRef, lonRef, dateObj });
                });
            });
        }

        // 🟢 初始化或顯示地圖彈出視窗
        window.openMapModal = function(id) {
            currentEditId = id;
            const item = uploadQueue[id];
            const modal = document.getElementById('mapModal');
            modal.classList.remove('hidden');

            // 決定地圖中心點 (如果沒座標，預設抓設備當前位置，否則放台灣中心)
            let centerLat = item.lat || 23.6978; 
            let centerLon = item.lon || 120.9605;
            let zoomLevel = item.lat ? 18 : 7;

            // 延遲初始化以確保 Modal 顯示後 Map 能正確計算寬度 (避免破圖)
            setTimeout(() => {
                const pos = { lat: centerLat, lng: centerLon };
                if (!modalMap) {
                    modalMap = new google.maps.Map(document.getElementById("modalMap"), {
                        zoom: zoomLevel, center: pos, mapTypeId: 'hybrid', disableDefaultUI: true, clickableIcons: false
                    });
                    modalMarker = new google.maps.Marker({
                        position: pos, map: modalMap, animation: google.maps.Animation.DROP, draggable: true
                    });
                    
                    // 點擊地圖移動圖釘
                    modalMap.addListener("click", (e) => modalMarker.setPosition(e.latLng));
                } else {
                    modalMap.setCenter(pos);
                    modalMap.setZoom(zoomLevel);
                    modalMarker.setPosition(pos);
                }

                // 如果完全沒座標，自動嘗試獲取當前設備定位當作輔助
                if (!item.lat) {
                    navigator.geolocation.getCurrentPosition(
                        (p) => {
                            const currentPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                            modalMap.setCenter(currentPos);
                            modalMap.setZoom(17);
                            modalMarker.setPosition(currentPos);
                        }, () => {} // 失敗則忽略
                    );
                }
            }, 100);
        };

        window.closeMapModal = function() {
            document.getElementById('mapModal').classList.add('hidden');
            currentEditId = null;
        };

        // 🟢 儲存手動點選的坐標並更新 UI
        window.saveManualLocation = function() {
            if (currentEditId === null || !modalMarker) return;
            const pos = modalMarker.getPosition();
            const lat = pos.lat();
            const lon = pos.lng();
            
            // 轉換 TWD97
            const twd97 = convertWGS84toTWD97(lon, lat);
            
            // 更新佇列數據
            uploadQueue[currentEditId].lat = lat;
            uploadQueue[currentEditId].lon = lon;
            uploadQueue[currentEditId].twd97x = twd97.x;
            uploadQueue[currentEditId].twd97y = twd97.y;
            
            // 更新畫面的表格欄位 (從紅色警告變成藍色坐標)
            const coordCell = document.getElementById(`coord-${currentEditId}`);
            coordCell.innerHTML = `
                <span class="cursor-pointer text-blue-600 hover:text-green-800 hover:underline transition-all block text-center" onclick="openMapModal(${currentEditId})">
                    ${twd97.x}<br>${twd97.y}
                </span>`;
            
            closeMapModal();
        };

        // 選擇檔案後，建立佇列並預覽
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            queueList.innerHTML = "";
            uploadQueue = [];
            startBtn.disabled = true;
            startBtn.innerText = "讀取相片 EXIF 中...";

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const exif = await extractExifData(file);
                
                let lat = 0, lon = 0, twd97x = 0, twd97y = 0, formattedDate = "無拍攝日期";
                
                if (exif.lat && exif.lon) {
                    const fmt = (c, r) => (c[0] + c[1]/60 + c[2]/3600) * (r === "S" || r === "W" ? -1 : 1);
                    lat = fmt(exif.lat, exif.latRef);
                    lon = fmt(exif.lon, exif.lonRef);
                    const twd97 = convertWGS84toTWD97(lon, lat);
                    twd97x = twd97.x; twd97y = twd97.y;
                }
                if (exif.dateObj) {
                    formattedDate = exif.dateObj.split(" ")[0].replace(/:/g, "/");
                }

                const previewUrl = URL.createObjectURL(file);
                
                uploadQueue.push({
                    id: i, file: file, lat: lat, lon: lon, twd97x: twd97x, twd97y: twd97y, 
                    date: formattedDate, address: "等待解析", aiNote: "等待 AI 分析", status: "ready"
                });

                // ✨ 如果沒坐標，顯示醒目的「紅色警告按鈕」引導點擊
                const coordHtml = (lat !== 0) 
                    ? `<span class="cursor-pointer text-blue-600 hover:text-green-800 hover:underline transition-all block text-center" onclick="openMapModal(${i})">${twd97x}<br>${twd97y}</span>`
                    : `<span class="cursor-pointer block text-center bg-red-50 text-red-500 font-bold px-2 py-1.5 rounded-lg border border-red-200 shadow-sm hover:bg-red-100 transition-all text-[10px]" onclick="openMapModal(${i})">📍 點此設定坐標</span>`;

                const tr = document.createElement('tr');
                tr.id = `row-${i}`;
                tr.innerHTML = `
                    <td class="p-3"><img src="${previewUrl}" class="w-12 h-12 object-cover rounded-md shadow-sm border border-slate-200"></td>
                    <td class="p-3 font-mono text-xs text-slate-600 text-center">${formattedDate}</td>
                    <td class="p-3 font-mono text-xs" id="coord-${i}">${coordHtml}</td>
                    <td class="p-3 text-xs text-slate-500" id="note-${i}">等待處理...</td>
                    <td class="p-3 text-center" id="status-${i}"><span class="bg-slate-200 text-slate-600 py-1 px-2 rounded text-[10px] font-bold">待機中</span></td>
                `;
                queueList.appendChild(tr);
            }

            startBtn.disabled = false;
            startBtn.innerText = `開始批次處理 (${uploadQueue.length})`;
        });

        // 影像處理 (縮圖 + 日期)
        async function processImage(file, watermarkDate) {
            return new Promise(r => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('processCanvas'); const ctx = cvs.getContext('2d');
                    cvs.width = 3000; cvs.height = 2000;
                    const rat = 1.5; let w = img.width, h = img.height, sx = 0, sy = 0;
                    if (w/h > rat) { w = h * rat; sx = (img.width - w)/2; } else { h = w / rat; sy = (img.height - h)/2; }
                    ctx.drawImage(img, sx, sy, w, h, 0, 0, 3000, 2000);
                    
                    const displayDate = watermarkDate === "無拍攝日期" ? new Date().toLocaleDateString('zh-TW') : watermarkDate;
                    ctx.font = "bold 120px Arial"; ctx.fillStyle = "red"; ctx.textAlign = "right";
                    ctx.fillText(displayDate, 2950, 1950);
                    
                    r(cvs.toDataURL('image/jpeg', 0.85).split(',')[1]);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // 更新狀態 UI
        function updateRowStatus(id, msg, state, noteText = null) {
            const statusCell = document.getElementById(`status-${id}`);
            const noteCell = document.getElementById(`note-${id}`);
            if (noteText) noteCell.innerText = noteText;
            if (state === 'processing') {
                statusCell.innerHTML = `<span class="bg-blue-100 text-blue-700 py-1 px-2 rounded text-[10px] font-bold animate-pulse">${msg}</span>`;
            } else if (state === 'done') {
                statusCell.innerHTML = `<span class="bg-green-100 text-green-700 py-1 px-2 rounded text-[10px] font-bold">✅ 成功</span>`;
                noteCell.classList.add('text-green-700', 'font-semibold');
            } else if (state === 'error') {
                statusCell.innerHTML = `<span class="bg-red-100 text-red-700 py-1 px-2 rounded text-[10px] font-bold">❌ 失敗</span>`;
                noteCell.innerHTML = `<span class="text-red-500 font-bold">${msg}</span>`;
            }
        }

        // 開始上傳
        startBtn.addEventListener('click', async () => {
            if (isProcessing || uploadQueue.length === 0) return;
            
            // 檢查是否還有未設定坐標的照片
            const missingCoords = uploadQueue.filter(item => item.lat === 0);
            if (missingCoords.length > 0) {
                const confirmProceed = confirm(`有 ${missingCoords.length} 張照片尚未設定坐標，確定要直接上傳嗎？（建議先點擊紅色按鈕補齊坐標）`);
                if (!confirmProceed) return;
            }

            isProcessing = true;
            startBtn.disabled = true;
            fileInput.disabled = true;
            overallProgress.classList.remove('hidden');
            
            const authCode = document.getElementById('authCode').value;
            const deviceName = "PC/Batch Upload";
            let successCount = 0;

            for (let i = 0; i < uploadQueue.length; i++) {
                const item = uploadQueue[i];
                if (item.status === 'done') continue;

                try {
                    // 1. 地址
                    if (item.lat !== 0) {
                        updateRowStatus(i, "解析地址...", "processing", "向 Google 查詢路名中...");
                        const addrRes = await fetch(`${GAS_URL}?lat=${item.lat}&lon=${item.lon}`);
                        const addrData = await addrRes.json();
                        item.address = (addrData.address === "無法解析地址" || addrData.address.includes("錯誤")) ? "無地址資訊" : addrData.address;
                    }

                    // 2. 影像
                    updateRowStatus(i, "處理影像...", "processing", "壓縮與壓印浮水印...");
                    const b64 = await processImage(item.file, item.date);

                    // 3. AI
                    updateRowStatus(i, "AI 分析中...", "processing", "呼叫 Gemini 辨識災情...");
                    const aiRes = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "analyze_only", photo_base64: b64 }) });
                    const aiData = await aiRes.json();
                    item.aiNote = (aiData.status === "success") ? aiData.message : "AI 辨識失敗";

                    // 4. 上傳
                    updateRowStatus(i, "上傳雲端...", "processing", `[地址]: ${item.address}\n[AI]: ${item.aiNote}`);
                    const payload = {
                        auth_code: authCode, device: deviceName, latitude: item.lat, longitude: item.lon,
                        twd97_x: item.twd97x, twd97_y: item.twd97y, road_name: item.address, note: item.aiNote,
                        exif_date: item.date, photo_base64: b64
                    };

                    const saveRes = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const saveData = await saveRes.json();

                    if (saveData.status === "success") {
                        item.status = "done";
                        successCount++;
                        updateRowStatus(i, "", "done", `[${item.address}] ${item.aiNote}`);
                    } else { throw new Error(saveData.message); }

                } catch (err) {
                    item.status = "error"; updateRowStatus(i, err.message || "系統異常", "error");
                }

                // 更新進度條
                const percent = Math.round(((i + 1) / uploadQueue.length) * 100);
                progressBar.style.width = `${percent}%`;
                progressText.innerText = `${i + 1} / ${uploadQueue.length}`;
            }

            isProcessing = false; fileInput.disabled = false;
            startBtn.innerText = `處理完成 (${successCount}/${uploadQueue.length})`;
            alert(`批次處理完畢！共成功上傳 ${successCount} 張照片。`);
        });
    </script>
</body>
</html>
